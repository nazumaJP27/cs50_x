<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions
            // Multiple choice checks:
            document.addEventListener('DOMContentLoaded', function() {
                let corrects = document.querySelectorAll('.correct');
                let incorrects = document.querySelectorAll('.incorrect');

                for (let i = 0; i < corrects.length; i++)
                {
                    corrects[i].addEventListener('click', function()
                    {
                        corrects[i].style.backgroundColor = 'green';
                        document.getElementById('feedback-s1').innerHTML = 'Correct!';
                    });
                }
                for (let i = 0; i < incorrects.length; i++)
                {
                    incorrects[i].addEventListener('click', function()
                    {
                        incorrects[i].style.backgroundColor = 'red';
                        document.getElementById('feedback-s1').innerHTML = 'Incorrect...';
                    });
                }

                // Free response check:
                document.getElementById('check-button').addEventListener('click', function()
                {
                    let user_response = document.querySelector('input');
                    if (user_response.value.toLowerCase() === "the last guardian")
                    {
                        user_response.style.backgroundColor = 'green';
                        document.getElementById('feedback-s2').innerHTML = 'Correct!';
                    }
                    else
                    {
                        user_response.style.backgroundColor = 'red';
                        document.getElementById('feedback-s2').innerHTML = 'Incorrect...';
                    }
                });
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                <h3> How many colossi are slayed by Wander in Shadow of the Colossus?</h3>
                <div class="answer-choices">
                    <button class="incorrect"> 14 </button>
                    <button class="incorrect"> 15 </button>
                    <button class="correct"> 16 </button>
                    <button class="incorrect"> 17 </button>
                    <button class="incorrect"> 18 </button>
                </div>
                 <p class="feedback-text" id="feedback-s1"></p>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                 <h3> What is the third game directed by Fumito Ueda?</h3>
                 <input type="text"></input>
                 <button id="check-button"> Check Answer </button>
                 <p class="feedback-text" id="feedback-s2"></p>
            </div>
        </div>
    </body>
</html>
